 yug_war_against_ottomans_desc: "§R[Root.GetName] erklärt Krieg gegen [TUR.GetName].§!\n§YVerbündete können dann dazu gerufen werden.§!\nEs ist Zeit für einen Kreuzzug! Ihr werden den Osmanen angreifen um Konstantinopel zurück zu erobern. Solang ihr mit den Osmanen im Krieg seid, werdet ihr regelmäßig Hilfe von euren christlichen Brüdern erhalten."
