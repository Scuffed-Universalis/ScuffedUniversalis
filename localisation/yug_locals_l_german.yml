 #Generics
 yug_yes: "Ja"
 yug_no: "Nein"
 yug_recent_culture_progress: "Recent Culture Progress"
 desc_yug_recent_culture_progress: "Recent made progress in solving the culture conflicts."
 yug_flavor_new_dynasty_title:0 "A new Heir"
 yug_flavor_new_dynasty_desc:0 "A country without a secured succession is a country in peril. Not daring to wait for a royal heir of [Root.Monarch.GetHerHis] own making, [Root.Monarch.GetName] has appointed a relative from [From.GetName] as the designated heir."
 yug_flavor_peasants_republic_title:0 "Peasant Revolt"
 yug_flavor_peasants_republic_desc:0 "The peasantry has for some time demanded economic, religious and political amendments. Their dissatisfaction has grown to such an extent that violent revolts are becoming a common day practice. Even though there is no central leadership and they lack proper armament, the peasants have still managed to pose a challenge to the authority. Several important buildings, both religious and other, have been burnt and plundered as a protest."
 yug_slovenia_title:0 "Conquer Slovenia"
 yug_slovenia_desc:0 ""
 yug_westernize_title:0 "Westernize"
 yug_westernize_desc:0 ""
 yug_build_treasury_title:0 "Füllt die Schatzkammern"
 yug_build_treasury_desc:0 "Eine volle Schatzkammer ist ein notwendiger Puffer für alles, was uns passieren könnte. Wenn dies als geizig angesehen wird, dann nur deshalb, weil einige nicht das Laster eines Herrschers erkennen."
 yug_build_manufactories_title:0 "Baut Manufakturen"
 yug_build_manufactories_desc:0 "Im Bereich der Produktion, sowohl technologisch als auch organisatorisch, sind große Fortschritte zu machen. Lasst uns in viele neue Manufakturen investieren und eine große industrielle Revolution könnte schon bald kommen."
 yug_army_enthusiasm:0 "Armee-Enthusiasmus"
 desc_yug_army_enthusiasm:1 "Unsere Bereitschaft, in eine stehende Armee zu investieren, hat zu neuen Enthusiasmus innerhalb der Armee geführt. Viele sind auf eine Militärkarriere aus, sowohl einfache Bürger als auch höher gestellte, und unsere Anwerber, die in der Vergangenheit jeden akzeptieren mussten, der an einer solchen Karriere interessiert ist, haben nun den Luxus der Wahl."
 yug_coal_mining:0 "Kohlebergbau"
 desc_yug_coal_mining:0 "Die Kohlegruben von Hum befeuern unsere Hochöfen und Werkstätten."
