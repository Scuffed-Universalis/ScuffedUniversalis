 yug_begin_culture_conflict: "Kulturkonflikte"
 yug_begin_culture_conflict_desc: "Der Konflikt zwischen Serben, Bosniern und Kroaten tobt. Serben und Bosnier haben eine hohe Wahrscheinlichkeit zu rebellieren."
 yug_begin_culture_conflict_1: "Wir müssen die Kulturkonflikte lösen"
 
 yug_flavor_croats_rise_up_title: "Kroaten erheben sich!"
 yug_flavor_serbs_rise_up_title: "Serben erheben sich!"
 yug_flavor_bosnians_rise_up_title: "Bosnier erheben sich!"
 yug_flavor_rise_up_desc: "Der Kulturkonflikt wütet und die Bauern fordern mehr Rechte!"
 yug_flavor_rebels_rise_up: "Nicht auf Forderungen eingehen"
 yug_flavor_give_autonomy: "Autonomie erhöhen"
