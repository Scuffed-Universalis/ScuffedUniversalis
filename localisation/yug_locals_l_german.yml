 #YUG National Ideas
 yug_bastion_of_orthodoxy: "Christliche Bastion"
 yug_bastion_of_orthodoxy_desc: "Vereint Katholen und Orthodoxe gegen den muslimischen Feind im Osten."
 yug_country_of_slaves: "Land der Slaven"
 yug_country_of_slaves_desc: "Die slavische Bevölkerung aus den Nachbarländern zieht zu euch. Die slavischen Männer sind kampfesfreudig und schließen sich bereitwillig eurer Armee an."
 yug_balkan_hajduks: "Balkan Heiducken"
 yug_balkan_hajduks_desc: "Hajduks in Serbia and neighboring Balkan lands have earned a more infamous reputation. These men lived the hard life of brigands, always in danger, always on the move: preying on poorly defended roads, ambushing Turkish tax collectors and merchants."
 yug_administrate_gold_mines: "Verwaltete Goldminen"
 yug_administrate_gold_mines_desc: "Invite the second wave of Saxon miners all the way from the Holy Roman Empire to settle in Serbia. We can re-open the ancient gold mines that had once made the small Serbian Despotate the richest country in Europe."
 yug_flexible_diplomacy: "Flexible Diplomatie"
 yug_flexible_diplomacy_desc: "Due to its position between a hammer and an anvil, the West and the East, the cities of Rome and Constantinople, Yugoslavia has to adapt in order to thrive. While to some maintaining good relations with lands far away is a matter of luxury and prestige, to Yugoslavia it's a matter of survival."
 yug_pan_slavic: "Pan Slavismus"
 yug_pan_slavic_desc: "Vereint die Slaven und macht sie zu einem starken Volk."
 yug_orthodox_orders: "Ritterorden"
 yug_orthodox_orders_desc: "Ritterorden organisieren sich, um mit euch gegen die Muslime im Osten zu kämpfen."
 
 #Form Yug
 form_yugoslavia_title: "Gründe das Königreich Jugoslawien"
 form_yugoslavia_desc: "Das Königreich Jugoslawien, auch als erstes Jugoslawien bezeichnet, war von seiner Gründung 1918 bis zur Besetzung durch die Achsenmächte im Zweiten Weltkrieg 1941 eine Monarchie."
 
 #YUG Dominance modifier
 yug_serbian_dominance: "Serbische Dominanz"
 desc_yug_serbian_dominance: "Serben sind nicht Teil des Kulturkonfliktes."
 yug_bosnian_dominance: "Bosnische Dominanz"
 desc_yug_bosnian_dominance: "Bosnier sind nicht Teil des Kulturkonfliktes."
 
 #YUG Culture Conflict modifier
 yug_culture_conflict: "Kulturkonflikte"
 desc_yug_culture_conflict: "Der Konflikt zwischen Serben, Bosniern und Kroaten tobt. Serben und Bosnier haben eine hohe Wahrscheinlichkeit zu rebellieren."
 
 yug_resolving_culture_conflict: "Kulturkonflikte lösen"
 desc_yug_resolving_culture_conflict: "Der Konflikt zwischen Serben, Bosniern und Kroaten wird probiert zulösen. Serben und Bosnier haben eine geringere Wahrscheinlichkeit zu rebellieren."
 
 yug_croats_culture_conflict: "Kulturkonflikte mit Kroaten"
 desc_yug_croats_culture_conflict: "Der Kulturkonflikt beschränkt sich nun nur noch auf die Kroaten."
 
 yug_resolved_culture_conflict: "Kulturkonflikte gelöst"
 desc_yug_resolved_culture_conflict: "Der Kulturkonflikt, der unserer Land ins Chaos stürtzte, ist gelöst wurden. Die Slaven stehen jetzt vereint gegen die Welt."
 
 #YUG Flavor events
 yug_flavor_festival_title: "Ein Fest!"
 yug_flavor_festival_desc: "Das slavische Volk freut sich über die verhältnismäßige Stabilität im Land. In den Städt und Dörfen feiert man ein Volksfest."
 yug_flavor_festival_1: "Feiert schön"
 yug_flavor_festival_2: "Feiert die Kultureinheit"
 
