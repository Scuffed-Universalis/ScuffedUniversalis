 #YUG Crusade
 yug_defends_against_ottomans: "Verteidigung gegen die Osmanen"
 desc_yug_defends_against_ottomans: "Wir verteidigen uns gegen die Osmanen."
 yug_crusade_against_ottomans: "Kreuzzug gegen die Osmanen"
 desc_yug_crusade_against_ottomans: "Wir sind in einem Kreuzzug gegen die Osmanen."
 yug_till_end_of_crusade:0 "end of Crusade"
 yug_crusade_begins_title: "Kreuzzug gegen die Osmanen"
 yug_crusade_begins_desc: "Es ist Zeit für einen Kreuzzug! Ihr werden den Osmanen angreifen um Konstantinopel zurück zu erobern. Solang ihr mit den Osmanen im Krieg seid, werdet ihr regelmäßig Hilfe von euren christlichen Brüdern erhalten."
 yug_crusade_begins_1: "Deus lo Vult!"
 yug_crusade_begins_2: "Blast den Kreuzzug ab"
 
 yug_crusade_help_title: "Eure christlichen Brüder schicken Hilfe!"
 yug_crusade_help_desc: "Verstärkung aus der christlichen Welt trifft ein. Wo zu möchtet ihr sie einsetzen?"
 yug_crusade_man: "Wir brauchen mehr Soldaten!"
 yug_crusade_cash: "Geld für den Kreuzzug!"
 yug_crusade_mil: "Taktische Unterstützung!"
 yug_crusade_officer: "Unsere Generäle sind unfähig, tauscht einen aus!"
 
 yug_crusade_over_title: "Der Kreuzzug gegen die Osmanen ist zu Ende"
 yug_crusade_over_desc: "Egal ob erfolgreich oder nicht, die Kreuzfahrer kehren wieder Heim."
 yug_crusade_over_1: "Danke für die Hilfe!"
 
 
