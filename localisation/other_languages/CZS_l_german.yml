l_german:
 #Czechoslovakia, ported from Doge Shattered Europa
 CZS: "Czechoslovakia"
 CZS_ADJ: "Czechoslovakian"
 CZS_ADJ2: "Czechoslovakian"
 form_czechoslovakia_nation_title: "Unification of Czechoslovakia"
 form_czechoslovakia_nation_desc: "We must unite our Slavic brethren if we are to secure our continued independence from the Germans!\n\n§RUnless we are an Elector, forming Czechoslovakia will remove us from the Holy Roman Empire.§!"
 form_czechoslovakia_leave_hre_tt: "§RIf we are not an Elector, we will leave the Holy Roman Empire.§!"
 czechoslovak_republic_reform: "Czechoslovak Republic"
 czechoslovak_republic_reform_desc: "Czechs and Slovaks now govern themselves as one republic. Ever since the Hussite wars our peoples have known how to stand together against foreign armies and foreign churches alike. Whatever faith our citizens hold, the Republic defends it, and every town and village is ready to take up arms for the common cause."
 CZS_ideas: "Czechoslovakian Ideas"
 CZS_ideas_start: "Czechoslovakian Traditions"
 CZS_ideas_bonus: "Czechoslovakian Ambition"
 CZS_1: "Czechoslovakian Unity"
 CZS_1_desc: "Our two cultures' close ties have given us a peace that other nations can only dream of upon unification. Czech and Slovak are slowly becoming one in culture."
 CZS_2: "The Hussite Reformation"
 CZS_2_desc: "We were the forerunners of the Protestant Reformation. Our national church has survived both inquisitions and a brutal crusade. There is nothing the west can do to further harm us."
 CZS_3: "Mountain Fortresses"
 CZS_3_desc: "Our mountainous frontiers are an excellent place to defend our territory. Many enemies will enter here and many enemies will die."
 CZS_4: "Wagenburg"
 CZS_4_desc: "During the Hussite wars, our armies relied on wagon forts, which would allow us to win battles we should have lost. Although we may not always use wagons, using infantry sharpshooters from defensive position is our tactic of choice."
 CZS_5: "The Kutnohorian Deal"
 CZS_5_desc: "The nobility will always remain sensitive regarding their prerogatives, so we need to guarantee that their privileges are guaranteed forever."
 CZS_6: "Jewish Communities"
 CZS_6_desc: "The Jews of Europe have been maligned for centuries. Let us welcome them into our glorious nation with open arms, and even permit them the right to participate in government."
 CZS_7: "Czechoslovakian Union"
 CZS_7_desc: "Our two cultures have become as one. Never again shall Czech or Slovak be submissive to another power!"
