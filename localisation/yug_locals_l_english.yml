 #Generics
 yug_yes: "Yes"
 yug_no: "No"
 yug_build_treasury_title:0 "Build a Treasury"
 yug_build_treasury_desc:0 "A large treasury is an imperative buffer for all things that could befall us through. If this is seen as miserly, it is because some do not realize that this vice is the very essence of what it means to reign."
 yug_build_manufactories_title:0 "Build Manufactories"
 yug_build_manufactories_desc:0 "Great advances are being made in the field of production, both technological and organizational. Let us invest greatly in new manufactories, a great industrious revolution might soon be upon us."
 yug_army_enthusiasm:0 "Army Enthusiasm"
 desc_yug_army_enthusiasm:1 "Our willingness to invest in the creation of standing armies have led to a wave of enthusiasm for the army. Many are seeking army careers both among commoners and the more well to do and our recruiters now have the luxury of choice where they might in the past have had to accept whoever was interested."
 yug_coal_mining:0 "Coal Mining Industry"
 desc_yug_coal_mining:0 "The coal pits of Hum fuel our furnaces and workshops."
