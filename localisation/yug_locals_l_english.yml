 yug_crusade_begins_desc: "It's time for a crusade! You will attack the Ottoman to retake Constantinople. As long as you are at war with the Ottomans, you will receive regular help from your Christian brothers."
 yug_crusade_begins_1: "Deus lo Vult!"
 yug_crusade_begins_2: "Call off the Crusade"
 
 yug_crusade_help_title: "Your Christian brothers send help!"
 yug_crusade_help_desc: "Reinforcements from the Christian world arrive. How do you want to use them?"
 yug_crusade_man: "We need more Soldiers!"
 yug_crusade_cash: "Ducats for the Crusade!"
 yug_crusade_mil: "Tactical Support!"
 yug_crusade_officer: "Hire a new General!"
 
