 #YUG National Ideas
 yug_bastion_of_orthodoxy: "Christian Bastion"
 yug_bastion_of_orthodoxy_desc: "Unites Catholics and Orthodox against the Muslim enemy in the East."
 yug_country_of_slaves: "Land of the Slavs"
 yug_country_of_slaves_desc: "The Slavic population from neighboring countries is moving to you. The Slavic men are keen to fight and willingly join your army."
 yug_balkan_hajduks: "Balkan Hajduks"
 yug_balkan_hajduks_desc: "Hajduks in Serbia and neighboring Balkan lands have earned a more infamous reputation. These men lived the hard life of brigands, always in danger, always on the move: preying on poorly defended roads, ambushing Turkish tax collectors and merchants."
 yug_administrate_gold_mines: "Administrate Gold Mines"
 yug_administrate_gold_mines_desc: "Invite the second wave of Saxon miners all the way from the Holy Roman Empire to settle in Serbia. We can re-open the ancient gold mines that had once made the small Serbian Despotate the richest country in Europe."
 yug_flexible_diplomacy: "Flexible Diplomacy"
 yug_flexible_diplomacy_desc: "Due to its position between a hammer and an anvil, the West and the East, the cities of Rome and Constantinople, Yugoslavia has to adapt in order to thrive. While to some maintaining good relations with lands far away is a matter of luxury and prestige, to Yugoslavia it's a matter of survival."
 yug_pan_slavic: "Pan Slavism"
 yug_pan_slavic_desc: "Unite the slaves and make them a strong nation."
 yug_orthodox_orders: "Chivalric Orders"
 yug_orthodox_orders_desc: "Knight orders organize to fight with you against the Muslims in the east."
 
 #Form Yug
 form_yugoslavia_title: "Found the Kingdom of Yugoslavia"
 form_yugoslavia_desc: "The Kingdom of Yugoslavia, also known as the first Yugoslavia, was a monarchy from its foundation in 1918 until it was occupied by the Axis powers in World War II in 1941."
 
 #YUG Dominance modifier
 yug_serbian_dominance: "Serbian Dominance"
 yug_bosnian_dominance: "Bosnian Dominance"
 desc_yug_serbian_dominance: "Serbs are not part of the cultural conflict."
 desc_yug_bosnian_dominance: "Bosnians are not part of the cultural conflict."
 
 #YUG Culture Conflict modifier
 yug_culture_conflict: "Cultural Conflicts"
 desc_yug_culture_conflict: "The conflict between Serbs, Bosnian and Croatians is raging. Serbs and Bosnians are very likely to rebel."
 
 yug_resolving_culture_conflict: "Solve Cultural Conflicts"
 desc_yug_resolving_culture_conflict: "The conflict between Serbs, Bosnian and Croatians is trying to be resolved. Serbs and Bosnians are less likely to rebel."
 
 yug_croats_culture_conflict: "Cultural Conflicts with Croats"
 desc_yug_croats_culture_conflict: "The cultural conflict is now limited to the Croatians."
 
 yug_resolved_culture_conflict: "Cultural Conflicts solved"
 desc_yug_resolved_culture_conflict: "The cultural conflict that plunged our country into chaos has been resolved. The slaves are now united against the world."
 
 yug_recent_culture_progress: "Recent Culture Progress"
 desc_yug_recent_culture_progress: "Recent made progress in solving the culture conflicts."

 #YUG Flavor events
 yug_flavor_festival_title: "A Festival!"
 yug_flavor_festival_desc: "The Slavic people are happy about the relative stability in the country. A folk festival is celebrated in the towns and villages."
 yug_flavor_festival_1: "Celebrate"
 yug_flavor_festival_2: "Celebrate the culturual Union"
 yug_flavor_new_dynasty_title:0 "A new Heir"
 yug_flavor_new_dynasty_desc:0 "A country without a secured succession is a country in peril. Not daring to wait for a royal heir of [Root.Monarch.GetHerHis] own making, [Root.Monarch.GetName] has appointed a relative from [From.GetName] as the designated heir."
 yug_flavor_peasants_republic_title:0 "Peasant Revolt"
 yug_flavor_peasants_republic_desc:0 "The peasantry has for some time demanded economic, religious and political amendments. Their dissatisfaction has grown to such an extent that violent revolts are becoming a common day practice. Even though there is no central leadership and they lack proper armament, the peasants have still managed to pose a challenge to the authority. Several important buildings, both religious and other, have been burnt and plundered as a protest."
 
 #YUG Culuture Conflict event
 yug_begin_culture_conflict: "Cultural Conflicts"
 yug_begin_culture_conflict_desc: "The conflict between Serbs, Bosnian and Croatians is raging. Serbs and Bosnians are very likely to rebel."
 yug_begin_culture_conflict_1: "We have to solve the cultural conflicts"
 yug_flavor_croats_rise_up_title: "Croats rise up!"
 yug_flavor_serbs_rise_up_title: "Serbs rise up!"
 yug_flavor_bosnians_rise_up_title: "Bosnians rise up!"
 yug_flavor_rise_up_desc: "The cultural conflict is raging and the farmers are demanding more rights!"
 yug_flavor_rebels_rise_up: "Rebels rise up"
 yug_flavor_give_autonomy: "Rais autonomy"
 yug_flavor_apeace: "Appease"
 
 
