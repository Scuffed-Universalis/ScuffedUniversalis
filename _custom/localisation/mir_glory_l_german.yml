l_german:
 countryname_Madagascar: "Madagascar"
 countryname_Madagascar_ADJ: "Madagascan"
 mir_pay_title:0 "Pay Them Well"
 mir_pay_desc:0 "Our soldiers will fight better if we pay them a better wage."
 mir_raise_the_banner_title:0 "Raise The Banners"
 mir_raise_the_banner_desc:0 "Our soldiers are primed and ready to take on the false kings around us."
 mir_malagasy_glory_title:0 "Madagascan Glory"
 mir_malagasy_glory_desc:0 "Now that our island is ours, it's time to focus on the mainland. First we'll need an economic advantage."
 mir_gold_title:0 "Two Steps Into History"
 mir_gold_desc:0 "With the abundance of gold mines the foreman have come up with a great idea, that would allow us to save our economy from collapse and the mines themselves, brilliant!"
 mir_moving_title:0 "Growing Our Influence"
 mir_moving_desc:0 "We need horn of Africa to ourselves, mainly the ports to give us an edge on our opponants, who knows what gifts they bring?"
 mir_decision_title:0 "Hegemony In Abissinia"
 mir_decision_desc:0 "Ethiopia is under our control and with it their claims to this land, take it all before others do."
 mir_argent_title:0 "Foothold in Argentina"
 mir_argent_desc:0 "Welcome to Argentina gentlemen. I will not lie the chances of your survival are small. Some may even turn against your friends as rebels. But you have my word, that I will use my money to ensure your bodies are given unto Mort's garden."
 mir_aust_title:0 "A Bigger Island"
 mir_aust_desc:0 "A new island has been discovered to the east, we need to reach it first and setup our colonies on key points."
 mir_cape_title:0 "Colonise The Cape"
 mir_cape_desc:0 "We need a basing point, the cape will do perfectly for our westward missions!"
 mir_west_title:0 "Take Out Lisbon"
 mir_west_desc:0 "Let us show them what defeat tastes like"
 mir_north_title:0 "Take Out  Roma"
 mir_north_desc:0 "Let us show them what defeat tastes like"
 mir_east_title:0 "Take Out  Wien"
 mir_east_desc:0 "Let us show them what defeat tastes like"
 mir_cope_title:0 "Western Guns"
 mir_cope_desc:0 "With footholds in Europe we are able to trade arms and strategy at a faster rate, let's use these to our advantage"
 mir_lima_title:0 "Conquer Lemur"
 mir_lima_desc:0 "King Julian, Maurice and Mort, three kings will bring down the Lima forts."
 mir_glory.1.t:0 "Unite The Isle"
 mir_glory.1.d:0 "The army is ready sire, the days of our enemies are numbered and the sun rises on the beginning of our illustrious nation."
 mir_glory.1.a:0 "Excellent, go and reclaim my island."
 mir_glory.2.t:0 "Faith In The Madagascan [Root.GovernmentName]"
 mir_glory.2.d:0 "Alongside the reforms to our ways of life and kingdom as a whole, many of our noblemen have chosen different paths of religion, shall we join them?"
 mir_glory.2.a:0 "Let us stay on our path."
 mir_glory.2.b:0 "It's time to join our brothers in christ."
 mir_glory.2.c:0 "Times are changing, the prophet speaks to us."
 mir_glory.3.t:0 "Pushing Madagascar Forward."
 mir_glory.3.d:0 "My Liege, Great minds are flocking to our nation from all around the world, bringing their knowledge and their ways of thinking. Also ambassadors have contacted the local tribes allowing us to remove the corridor into central Africa."
 mir_glory.3.a:0 "That's brilliant! Carry on."
 mir_glory.4.t:0 "Envoys From Another Continent"
 mir_glory.4.d:0 "With more ports under our control envoys from all over the world are visiting, we have to choose our allegiance."
 mir_glory.4.a:0 "Western gifts."
 mir_glory.4.b:0 "Eastern gifts."
 mir_glory.4.c:0 "We don't need their influence, we forge our own path."
 mir_glory.5.t:0 "A Crucial Decision"
 mir_glory.5.d:0 "Fate's path splits, where should we focus our efforts? this will have an important effect on the direction of our nation?"
 mir_glory.5.a:0 "North to Cairo. We must prepare for the upcoming war."
 mir_glory.5.b:0 "West through the jungles is where destiny takes us."
 mir_glory.5.c:0 "East through the barren deserts to a brighter future."
 mir_glory.6.t:0 "Rhyme of King Julian"
 mir_glory.6.d:0 "My Liege, scholars tell of an ancient Madagascan king who demanded "Lemur" be ours and he would lend us his greatest conquistador to assist us. Maybe this is how we fulfil his prophecy?"
 mir_glory.6.a:0 "I'm sure there's a joke somewhere."
